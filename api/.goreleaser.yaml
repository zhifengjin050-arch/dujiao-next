version: 2

project_name: dujiao-next

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    main: ./cmd/server
    binary: dujiao-next
    ldflags:
      - -s -w -X github.com/dujiao-next/internal/version.Version={{.Tag}}
    flags:
      - -tags=release
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    files:
      - ./config.yml.example
      - ./README.md
    name_template: >-
      {{ .ProjectName }}_
      {{- .Tag }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  footer: >-
    ---
    
    ## ?? Documentation(????)    
    - [Installation Guide](https://dujiao-next.com/deploy/)
    - [????](https://dujiao-next.com/deploy/)
